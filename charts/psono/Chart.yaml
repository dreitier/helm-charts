apiVersion: v2
appVersion: "7.5.8-4.9.5-1.10.4"
type: application
# batch/v1 CronJob, networking.k8s.io/v1 Ingress
kubeVersion: ">=1.21.0-0"
description: A Helm chart for psono password manager
icon: https://psono.com/web/image/res.company/1/logo
name: psono
version: 3.1.3
annotations:
  # appVersion is synced from this image tag on release
  dreitier.com/app-version-from: .server.image.tag
dependencies:
  # bundled PostgreSQL for local testing (official postgres image)
  - name: "postgres"
    version: "1.6.8"
    repository: "https://groundhog2k.github.io/helm-charts/"
    condition: server.db.bundled
maintainers:
  - name: Thomas Höll
    email: tho@dreitier.com
