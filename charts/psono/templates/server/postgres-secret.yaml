{{- if .Values.server.db.bundled }}
# Credentials for the bundled PostgreSQL (groundhog2k/postgres, see values "postgres"), local testing only
apiVersion: v1
kind: Secret
metadata:
  name: psono-postgres-credentials
  labels:
    {{- include "psono.server.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_PASSWORD: {{ .Values.server.db.password | b64enc }}
  POSTGRES_DB: {{ .Values.server.db.name | b64enc }}
  USERDB_USER: {{ .Values.server.db.user | b64enc }}
  USERDB_PASSWORD: {{ .Values.server.db.password | b64enc }}
{{- end }}
