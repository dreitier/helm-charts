{{- if and .Values.fileserver.enabled .Values.serviceAccounts.fileserver.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
{{- include "psono.fileserver.labels" . | nindent 4 }}
  name: {{ include "psono.serviceAccountName.fileserver" . }}
{{ include "psono.namespace" . | indent 2 }}
  annotations:
{{ toYaml .Values.serviceAccounts.fileserver.annotations | indent 4 }}
{{- end }}
