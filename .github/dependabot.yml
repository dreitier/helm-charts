version: 2
updates:
  # Docker images in values.yaml (image.repository/image.tag) and chart dependencies in Chart.yaml
  - package-ecosystem: helm
    directories:
      - "/charts/*"
    schedule:
      interval: weekly
    # "fix(deps): ..." is a conventional commit, so semantic-release creates a patch release
    # of the affected chart once the PR is merged
    commit-message:
      prefix: fix
      include: scope
    open-pull-requests-limit: 10

  # versions of the actions used in .github/workflows
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
