name: Lint and Test Charts

# Feature branches and pull requests are only linted/tested.
# Versions and releases are created exclusively on main (release.yaml).
on:
  push:
    branches-ignore:
      - main
    paths:
      - 'charts/**'
      - '.github/**'
      - '.pre-commit-config.yaml'
      - '.yamllint.yaml'
      - '.yamlfmt.yaml'
  # no path filter: the jobs are required status checks on main, so they have to report on every PR
  # (lint-chart only lints charts that actually changed)
  pull_request:

# a new commit on the same branch/PR cancels the previous run
concurrency:
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # fails if a hook would change files or reports errors; fix locally with "pre-commit run --all-files"
      - name: Run pre-commit on changed files
        run: |
          pip install pre-commit
          base="origin/${{ github.event.repository.default_branch }}"
          pre-commit run --show-diff-on-failure --color=always --from-ref "$(git merge-base "$base" HEAD)" --to-ref HEAD

  lint-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # ct compares against the default branch, which needs the full history
          fetch-depth: 0

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config .github/ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config .github/ct.yaml --target-branch ${{ github.event.repository.default_branch }} --validate-maintainers=false --debug
