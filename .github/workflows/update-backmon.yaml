name: Update backmon

# Triggered by the backmon release workflow (repository_dispatch "backmon-released") after a new
# image has been pushed, or manually. Opens (or updates) a PR that sets image.tag in
# charts/backmon/values.yaml; appVersion follows on the chart release (.github/scripts/prepare-chart-release.sh).
# The PR title decides the chart release: backmon patch -> fix, minor -> feat, major -> feat! (breaking).
on:
  repository_dispatch:
    types: [backmon-released]
  workflow_dispatch:
    inputs:
      version:
        description: backmon version, e.g. 4.0.1
        required: true

permissions:
  contents: read

concurrency:
  group: update-backmon
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.client_payload.version || inputs.version }}
    steps:
      - name: Validate version
        run: |
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid backmon version '${VERSION}'"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Update image tag
        id: update
        run: |
          values=charts/backmon/values.yaml
          current=$(yq '.image.tag' "$values")

          if [[ "$current" == "$VERSION" ]]; then
            echo "::notice::backmon is already at ${VERSION}"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "$(printf '%s\n%s\n' "$current" "$VERSION" | sort -V | tail -n 1)" != "$VERSION" ]]; then
            echo "::notice::${VERSION} is older than the current ${current}, nothing to do"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # replace only the tag inside the top-level "image:" block, keeping formatting and comments
          sed -i -E '/^image:/,/^[^[:space:]#]/ s/^([[:space:]]+tag:[[:space:]]*).*/\1"'"${VERSION}"'"/' "$values"
          if [[ "$(yq '.image.tag' "$values")" != "$VERSION" ]]; then
            echo "::error file=${values}::Could not update image.tag"
            exit 1
          fi

          IFS=. read -r cur_major cur_minor _ <<< "$current"
          IFS=. read -r new_major new_minor _ <<< "$VERSION"
          notes="https://github.com/dreitier/backmon/releases/tag/${VERSION}"
          footer=""
          if (( new_major > cur_major )); then
            title="feat(backmon)!: update backmon to ${VERSION}"
            footer="BREAKING CHANGE: backmon ${VERSION} is a new major version. Check its release notes before upgrading: ${notes}"
          elif (( new_minor > cur_minor )); then
            title="feat(backmon): update backmon to ${VERSION}"
          else
            title="fix(backmon): update backmon to ${VERSION}"
          fi

          {
            echo "changed=true"
            echo "title=${title}"
            echo "body<<EOF_BODY"
            echo "Updates backmon from ${current} to ${VERSION}."
            echo
            echo "Release notes: ${notes}"
            if [[ -n "$footer" ]]; then
              echo
              echo "$footer"
            fi
            echo "EOF_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub App token
        if: steps.update.outputs.changed == 'true'
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # PRs created with the app token (unlike GITHUB_TOKEN) trigger the lint workflow.
      # A fixed branch means a newer backmon release updates the open PR instead of opening a second one.
      - name: Create or update pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ steps.app.outputs.token }}
          sign-commits: true
          branch: update/backmon
          delete-branch: true
          add-paths: charts/backmon/values.yaml
          commit-message: |
            ${{ steps.update.outputs.title }}

            ${{ steps.update.outputs.body }}
          title: ${{ steps.update.outputs.title }}
          body: ${{ steps.update.outputs.body }}
